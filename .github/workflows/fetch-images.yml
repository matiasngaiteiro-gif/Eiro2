# Baja las imágenes listadas en tools/fetch-images.txt ("nombre url" por línea) a img/gen/
# (JPG + WebP). Sirve para traer imágenes generadas desde servicios a los que el entorno de
# edición no llega. Al terminar borra la lista.
name: Traer imágenes
on:
  push:
    paths: ["tools/fetch-images.txt", ".github/workflows/fetch-images.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pillow
      - run: python tools/fetch_images.py
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git rm -q --cached tools/fetch-images.txt && rm tools/fetch-images.txt
          git add img/gen
          git commit -m "Imagenes generadas para los casos (img/gen)" || exit 0
          git push
