# Convierte los mockups de tools/mockups/src (HTML 1200×900) en imágenes para la portada,
# con las tipografías reales (Google Fonts), y las guarda en img/mockups.
name: Renderizar mockups
on:
  push:
    paths: ["tools/mockups/src/**", "tools/mockups/render.mjs", "tools/mockups/to_webp.py", ".github/workflows/render-mockups.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm i --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node tools/mockups/render.mjs
      - run: pip install -q pillow && python tools/mockups/to_webp.py
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add img/mockups
          git commit -m "Mockups de portada renderizados con sus tipografias (img/mockups)" || exit 0
          git pull --rebase && git push
