# Genera favicon, íconos y avatar con la G de Neulis Cursive Bold (la de GAITEIRO).
name: Renderizar iconos
on:
  push:
    paths: ["tools/icons/**", ".github/workflows/render-icons.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm i --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: |
          python -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          node tools/icons/render.mjs
      - run: pip install -q pillow && python tools/icons/make_icons.py
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add favicon.ico apple-touch-icon.png img/icon-192.png img/icon-512.png img/avatar-eiro.png
          git commit -m "Iconos y avatar con la G de Neulis Cursive" || exit 0
          git pull --rebase && git push
