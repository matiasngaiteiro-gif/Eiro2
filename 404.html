<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página no encontrada | Eiro Studio</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="stylesheet" href="https://use.typekit.net/xwf2bdv.css">
<style>
:root{--paper:#000000;--ink:#FFFFFF;--mute:#A0A0A0;--line:#262626;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px 20px;background:var(--paper);color:var(--ink);font-family:"neue-haas-grotesk-text","Helvetica Neue",Helvetica,Arial,sans-serif;font-synthesis:none;-webkit-font-smoothing:antialiased}
main{width:min(560px,100%)}
.eyebrow{display:block;font-size:16px;font-weight:500;color:var(--ink);margin-bottom:32px}
h1{margin:0;font-family:"neue-haas-grotesk-display","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:clamp(40px,8vw,96px);font-weight:600;letter-spacing:-.035em;line-height:.92}
p{margin:20px 0 32px;font-size:18px;font-weight:500;color:var(--mute)}
a{display:inline-flex;align-items:center;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:500;font-size:16px;text-decoration:none;min-height:48px;padding:0 26px}
a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main>
  <span class="eyebrow">Error 404</span>
  <h1>Esta página no existe.</h1>
  <p>Puede que el link esté mal escrito o que la hayamos movido.</p>
  <a href="/">Volver al inicio</a>
</main>
</body>
</html>
