<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página no encontrada | Eiro Studio</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#131313">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
<style>
:root{--paper:#131313;--ink:#ECECEC;--mute:#A3A3A3;--line:#2B2B2B;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px 20px;background:var(--paper);color:var(--ink);font-family:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{width:min(560px,100%)}
.eyebrow{display:block;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:32px}
h1{margin:0;font-size:clamp(36px,7vw,64px);font-weight:800;letter-spacing:-.05em;line-height:.96}
p{margin:20px 0 32px;font-size:18px;font-weight:500;color:var(--mute)}
a{display:inline-flex;align-items:center;min-height:44px;padding:0 22px;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:700;font-size:15px;text-decoration:none}
a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main>
  <span class="eyebrow">Error 404</span>
  <h1>Esta página no existe.</h1>
  <p>Puede que el link esté mal escrito o que la hayamos movido.</p>
  <a href="/">Volver al inicio</a>
</main>
</body>
</html>
